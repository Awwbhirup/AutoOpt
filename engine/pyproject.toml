[project]
name = "autoopt"
version = "0.1.0"
description = "Autonomous agent for verified, statistically-evaluated compiler optimization"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "z3-solver>=4.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
autoopt = "autoopt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoopt*"]

# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "statsmodels.*",
    "sklearn.*",
    "z3.*",
    "plotly.*",
    "seaborn.*",
    "matplotlib.*",
    "numpy.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: excluded from the default run (full-corpus and SMT-heavy tests)",
    "llm: requires a live LLM API key",
]
