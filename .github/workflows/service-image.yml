name: Service image

# Builds the compute service image and publishes it to the GitHub container
# registry, tagged with the commit and as latest. The host pulls from there.
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "service/**"
      - ".github/workflows/service-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-service" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 "${{ steps.name.outputs.image }}:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs svc
          exit 1
